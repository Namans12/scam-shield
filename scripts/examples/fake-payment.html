<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Fictional payment receipt (Scam Shield example)</title>
<style>
  body{margin:0;width:390px;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#111}
  .top{background:#0f9d58;color:#fff;text-align:center;padding:36px 16px 28px}
  .tick{width:64px;height:64px;border-radius:50%;background:#fff;color:#0f9d58;font-size:40px;line-height:64px;margin:0 auto 12px}
  .amt{font-size:40px;font-weight:700}
  .ok{font-size:18px;margin-top:4px}
  .card{background:#fff;margin:14px;border-radius:14px;padding:6px 16px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
  .row:last-child{border:0}.k{color:#666}.v{text-align:right;font-weight:600;word-break:break-all}
  .foot{text-align:center;color:#888;font-size:12px;padding:8px 0 24px}
</style></head><body>
<div class="top"><div class="tick">✓</div><div class="amt">₹15,000</div><div class="ok">Payment Successful</div></div>
<div class="card">
  <div class="row"><span class="k">To</span><span class="v">Rohan Mehta<br><small>rohan.mehta@oksbi</small></span></div>
  <div class="row"><span class="k">From</span><span class="v">Priya Nair<br><small>amit.verma92@okaxis</small></span></div>
  <div class="row"><span class="k">UTR</span><span class="v">4827193650</span></div>
  <div class="row"><span class="k">Date</span><span class="v">31 Sep 2026, 11:42 AM</span></div>
  <div class="row"><span class="k">Status</span><span class="v" style="color:#0f9d58">Completed</span></div>
</div>
</body></html>
